<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VibeConnect — Supabase</title>

    <link rel="stylesheet" href="supabase.css">
</head>

<body>

    <main class="supabase-page">

        <section class="supabase-card">

            <div class="supabase-icon">
                ⚡
            </div>

            <h1>VibeConnect</h1>

            <p class="supabase-title">
                Backend Connection
            </p>

            <p class="supabase-description">
                VibeConnect backend services are being prepared.
                This system will handle accounts, profiles,
                posts, photos, videos, polls, likes and comments.
            </p>

            <div class="supabase-status">
                <span class="status-dot"></span>

                <span id="connectionStatus">
                    Checking connection...
                </span>
            </div>

            <div class="supabase-features">

                <div class="feature">
                    <span>👤</span>
                    <p>Profiles</p>
                </div>

                <div class="feature">
                    <span>📝</span>
                    <p>Posts</p>
                </div>

                <div class="feature">
                    <span>📸</span>
                    <p>Photos</p>
                </div>

                <div class="feature">
                    <span>🎥</span>
                    <p>Videos</p>
                </div>

                <div class="feature">
                    <span>📊</span>
                    <p>Polls</p>
                </div>

                <div class="feature">
                    <span>❤️</span>
                    <p>Likes</p>
                </div>

                <div class="feature">
                    <span>💬</span>
                    <p>Comments</p>
                </div>

                <div class="feature">
                    <span>🔐</span>
                    <p>Accounts</p>
                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</body>
</html>
