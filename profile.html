<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VibeConnect — Profile</title>

    <link rel="stylesheet" href="profile.css">

</head>

<body>

    <!-- =====================================================
         PROFILE HEADER
         ===================================================== -->

    <header class="profile-header">

        <a href="feed.html" class="back-button">
            ←
        </a>

        <h1>Profile</h1>

        <button
            id="settingsButton"
            class="header-button"
            type="button"
        >
            ⚙
        </button>

    </header>


    <!-- =====================================================
         PROFILE PAGE
         ===================================================== -->

    <main class="profile-container">

        <!-- Profile Card -->

        <section class="profile-card">

            <div class="profile-cover">

                <button
                    id="changeCoverButton"
                    class="change-cover-button"
                    type="button"
                >
                    📷 Change cover
                </button>

                <input
                    type="file"
                    id="coverInput"
                    accept="image/*"
                    hidden
                >

            </div>


            <div class="profile-information">

                <div class="profile-picture-wrapper">

                    <div
                        id="profileAvatar"
                        class="profile-avatar"
                    >
                        👤
                    </div>

                    <button
                        id="changeAvatarButton"
                        class="avatar-edit-button"
                        type="button"
                    >
                        📷
                    </button>

                    <input
                        type="file"
                        id="avatarInput"
                        accept="image/*"
                        hidden
                    >

                </div>


                <div class="profile-main-info">

                    <h2 id="profileName">
                        Your Name
                    </h2>

                    <p id="profileUsername">
                        @username
                    </p>

                    <p
                        id="profileBio"
                        class="profile-bio"
                    >
                        Tell people something about yourself.
                    </p>

                </div>


                <button
                    id="editProfileButton"
                    class="edit-profile-button"
                    type="button"
                >
                    Edit Profile
                </button>

            </div>


            <!-- =================================================
                 PROFILE STATS
                 ================================================= -->

            <div class="profile-stats">

                <div class="stat">

                    <strong id="postCount">
                        0
                    </strong>

                    <span>Posts</span>

                </div>


                <div class="stat">

                    <strong id="followerCount">
                        0
                    </strong>

                    <span>Followers</span>

                </div>


                <div class="stat">

                    <strong id="followingCount">
                        0
                    </strong>

                    <span>Following</span>

                </div>

            </div>

        </section>


        <!-- =====================================================
             PROFILE TABS
             ===================================================== -->

        <nav class="profile-tabs">

            <button
                class="profile-tab active"
                data-tab="posts"
                type="button"
            >
                📝 Posts
            </button>

            <button
                class="profile-tab"
                data-tab="media"
                type="button"
            >
                📸 Media
            </button>

            <button
                class="profile-tab"
                data-tab="saved"
                type="button"
            >
                🔖 Saved
            </button>

        </nav>


        <!-- =====================================================
             PROFILE CONTENT
             ===================================================== -->

        <section
            id="profileContent"
            class="profile-content"
        >

            <div class="empty-profile">

                <div class="empty-icon">
                    📝
                </div>

                <h3>No posts yet</h3>

                <p>
                    Your posts will appear here.
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         EDIT PROFILE MODAL
         ===================================================== -->

    <div
        id="profileModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2>Edit Profile</h2>

                <button
                    id="closeModalButton"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="profileForm">

                <label for="nameInput">
                    Name
                </label>

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Your name"
                    maxlength="50"
                    required
                >


                <label for="usernameInput">
                    Username
                </label>

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="username"
                    maxlength="30"
                    required
                >


                <label for="bioInput">
                    Bio
                </label>

                <textarea
                    id="bioInput"
                    placeholder="Tell people about yourself..."
                    maxlength="160"
                    rows="4"
                ></textarea>


                <button
                    type="submit"
                    class="save-profile-button"
                >
                    Save Profile
                </button>

            </form>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="profile.js"></script>

</body>

</html>
