<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reels • VibeConnect</title>

    <link
        rel="stylesheet"
        href="reels.css"
    >
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="reels-header">

        <div class="header-left">

            <a
                href="app.html"
                class="back-button"
                aria-label="Back to VibeConnect"
            >
                ←
            </a>

            <div class="brand">

                <h1>VibeConnect</h1>

                <span>Reels</span>

            </div>

        </div>


        <div class="header-actions">

            <a
                href="create.html"
                class="create-button"
            >
                ＋ Create
            </a>

        </div>

    </header>


    <!-- =====================================================
         REELS NAVIGATION
    ====================================================== -->

    <nav class="reels-nav">

        <button
            class="reel-tab active"
            data-feed="for-you"
        >
            For You
        </button>

        <button
            class="reel-tab"
            data-feed="following"
        >
            Following
        </button>

        <button
            class="reel-tab"
            data-feed="trending"
        >
            Trending
        </button>

    </nav>


    <!-- =====================================================
         MAIN REELS FEED
    ====================================================== -->

    <main
        id="reelsFeed"
        class="reels-feed"
    >

        <!-- Reels generated by reels.js -->

    </main>


    <!-- =====================================================
         EMPTY STATE
    ====================================================== -->

    <section
        id="emptyState"
        class="empty-state hidden"
    >

        <div class="empty-icon">
            🎬
        </div>

        <h2>
            No reels here yet
        </h2>

        <p>
            Create your first short video and
            share your vibe with the community.
        </p>

        <a
            href="create.html"
            class="empty-create-button"
        >
            Create a Reel
        </a>

    </section>


    <!-- =====================================================
         COMMENTS MODAL
    ====================================================== -->

    <div
        id="commentsModal"
        class="modal hidden"
    >

        <div
            class="modal-overlay"
            id="commentsOverlay"
        ></div>

        <div class="comments-modal">

            <div class="modal-header">

                <div>
                    <h2>Comments</h2>

                    <span id="commentCount">
                        0 comments
                    </span>
                </div>

                <button
                    id="closeComments"
                    class="close-button"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div
                id="commentsList"
                class="comments-list"
            >
            </div>


            <form
                id="commentForm"
                class="comment-form"
            >

                <input
                    type="text"
                    id="commentInput"
                    maxlength="180"
                    placeholder="Add a comment..."
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                >
                    Post
                </button>

            </form>

        </div>

    </div>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
    >

        <span id="toastIcon">
            ✓
        </span>

        <span id="toastMessage">
            Done
        </span>

    </div>


    <script src="reels.js"></script>

</body>

</html>
